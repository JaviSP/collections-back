version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: collections-postgres
    environment:
      POSTGRES_DB: collections_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - collections-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collections-back
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: collections_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - collections-network

volumes:
  postgres-data:

networks:
  collections-network:
    driver: bridge
